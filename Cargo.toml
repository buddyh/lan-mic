[package]
name = "lan-mic"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
description = "Microphone forwarding that follows LAN Mouse focus"
authors = ["Buddy Hadry"]
license = "GPL-3.0-or-later"
repository = "https://github.com/buddyh/lan-mic"
readme = "README.md"
keywords = ["microphone", "lan-mouse", "audio", "macos", "linux"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rubato = { version = "0.16.2", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "time", "io-util", "io-std", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
tray-icon = { version = "0.26.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSRunningApplication", "NSWindow", "NSView", "NSButton", "NSButtonCell", "NSPopUpButton", "NSGraphics", "NSTextField", "NSControl", "NSFont", "NSColor", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject", "NSString", "NSDate", "NSRunLoop", "NSGeometry", "NSData"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[profile.release]
lto = "thin"
strip = true
